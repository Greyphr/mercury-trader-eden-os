# ──────────────────────────────────────────────────────────────
# Providers — external integrations configuration.
# Secrets (API keys, passwords) come from environment / .env.
# ──────────────────────────────────────────────────────────────

broker:
  #   mt5   = MetaTrader 5 terminal (Exness) — real + demo accounts
  #   paper = local simulation (default)
  # Selected by the active environment profile (config/environments.yaml).
  backend: paper
  mt5:
    symbol: GOLD
    timeframe: M5
    order_mode: MARKET
    magic: 77001
    slippage_points: 20
    # Credentials come from the environment profile's env-var names
    # (e.g. MT5_LOGIN_LIVE / MT5_PASSWORD_LIVE for the exness_live profile).

data:
  # Historical + live candle source.
  backend: mt5
  mt5:
    history_bars: 100000
    default_timeframe: M5

news:
  backends: [economic_calendar]        # enabled news adapters, e.g. [economic_calendar, rss]
  economic_calendar:
    source: forex_factory              # forex_factory | myfxbook
    major_impact_only: true
    blackout_minutes: 15               # before/after window around NFP/CPI/FOMC
  rss:
    feeds: []                  # list of RSS feed URLs (XAU/gold/news)
  sentiment:
    source: none               # none | fear_greed | social
    fear_greed_url: https://production.dataviz.cnn.io/index/fearandgreed/graphdata

llm:
  #   hybrid  = local fast pre-trade (Ollama) + external heavy reasoning
  #   local   = everything through Ollama
  #   external= everything through the external.provider below
  #   none    = rule-based Hermes (no LLM calls)
  mode: external
  external:
    provider: openai           # openai | anthropic | lm_studio
    openai: {}
    anthropic: {}
    lm_studio: {}
  local:
    provider: ollama
    timeout_seconds: 30
  structured:                  # JSON schema settings for reasoning output
    temperature: 0.2
    max_tokens: 1500
  confidence:
    min_gate: 0.55             # pre-trade minimum (mirrors risk.guards.min_confidence)

notifications:
  backend: telegram
  telegram:
    chat_id: ""                # from TELEGRAM_CHAT_ID
    disable_notification_for: [hermes_pre_trade]

signal:
  providers: [internal, tradingview]
  webhook:
    host: 0.0.0.0
    port: 9100                 # from SIGNAL_WEBHOOK_PORT
    # REQUIRED when deployment.mode is live (from SIGNAL_WEBHOOK_SECRET);
    # without it the server refuses to start / the startup gate blocks trading.
    secret: ""                 # from SIGNAL_WEBHOOK_SECRET

eden:
  # Outbound-only agent-mesh client (Eden OS device_terminals WebSocket).
  # Disabled by default: flip EDEN_AGENT_ENABLED=true only when ready to
  # test the agent-mesh wiring itself. Every field can be overridden by
  # env vars using the same names as Eden's agent_runtime/config.py.
  enabled: false               # from EDEN_AGENT_ENABLED
  url: ws://localhost:8765     # from EDEN_URL
  agent_id: mercury_trader     # from EDEN_AGENT_ID
  agent_name: Mercury Trader   # from EDEN_AGENT_NAME
  risk_tier: HIGH              # from EDEN_AGENT_RISK_TIER (LOW|MEDIUM|HIGH|CRITICAL)
  heartbeat_interval: 30.0     # from EDEN_HEARTBEAT_INTERVAL
  reconnect_base_delay: 1.0    # from EDEN_RECONNECT_BASE_DELAY
  reconnect_max_delay: 60.0    # from EDEN_RECONNECT_MAX_DELAY
  reconnect_backoff_factor: 2.0  # from EDEN_RECONNECT_BACKOFF_FACTOR
