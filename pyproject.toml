[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercury-trader"
version = "0.1.0"
description = "Adaptive intelligent trading bot/agent with a self-improving reasoning pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Mercury Trader" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # Eden agent-mesh client (src/mercury/services/eden): asyncio WebSocket client
    "websockets>=13,<16",
    # Eden agent-mesh identity: Ed25519 keypair for challenge-response auth
    "cryptography>=42",
]

[project.optional-dependencies]
llm = [
    "openai>=1.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
